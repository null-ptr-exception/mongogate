apiVersion: v1
kind: Service
metadata:
  name: monitor-mongo
  namespace: mongogate-test
spec:
  selector:
    app: monitor-mongo
  ports:
    - port: 27017
      name: mongod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-mongo
  namespace: mongogate-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-mongo
  template:
    metadata:
      labels:
        app: monitor-mongo
    spec:
      containers:
        - name: mongod
          image: mongo:8.0
          command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB=0.25"]
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "0.5"
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
