apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: mongo-source
  labels:
    app: mongo
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      name: mongod
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: mongo-source
  labels:
    app: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      name: mongod
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: mongo-source
spec:
  serviceName: mongo-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      initContainers:
        - name: copy-keyfile
          image: mongo:8.0
          command:
            - sh
            - -c
            - "cp /keyfile-secret/keyfile /etc/mongo-keyfile/keyfile && chmod 600 /etc/mongo-keyfile/keyfile"
          volumeMounts:
            - name: keyfile-secret
              mountPath: /keyfile-secret
              readOnly: true
            - name: keyfile
              mountPath: /etc/mongo-keyfile
      containers:
        - name: mongod
          image: mongo:4.4
          command:
            - mongod
            - --replSet=rs0
            - --bind_ip_all
            - --keyFile=/etc/mongo-keyfile/keyfile
            - --auth
            - --wiredTigerCacheSizeGB=0.25
          ports:
            - containerPort: 27017
              name: mongod
          readinessProbe:
            # mongosh-only on 6.0+, legacy mongo-only on 4.4, both on 5.0 -
            # try mongosh first, fall back to mongo, so this StatefulSet
            # works unmodified regardless of which image tag is set above.
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval \"db.runCommand('ping')\" || mongo --quiet --eval \"db.runCommand('ping')\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval \"db.runCommand('ping')\" || mongo --quiet --eval \"db.runCommand('ping')\""]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: keyfile
              mountPath: /etc/mongo-keyfile
            - name: data
              mountPath: /data/db
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongo-keyfile
            defaultMode: 0400
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
